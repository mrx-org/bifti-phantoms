[package]
name = "bifti"
version = "0.1.0"
edition = "2024"

[features]
tracing = ["dep:tracing"]

[dependencies]
nifti = { version = "0.17.0", default-features = false }
num-complex = "0.4.6"
regex = "1.13.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.19"
tracing = { version = "0.1.44", optional = true }
ureq = "3.3.0"
urlencoding = "2.1.3"
winnow = "1.0.4"

[dev-dependencies]
rand = "0.10.2"
tracing-chrome = "0.7.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[example]]
name = "download_random_phantom"
required-features = ["tracing"]
