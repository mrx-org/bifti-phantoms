[project]
name = "bifti"
version = "0.1.0"
description = "Load, save and resample BIfTI MRI simulation phantoms (JSON + NIfTI)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "J-Endres", email = "jonathan.endres01@gmail.com" }
]
keywords = ["mri", "phantom", "simulation", "nifti", "bifti"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "nibabel>=5.4.2",
    "numpy>=2.5.1",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/mrx-org/bifti-phantoms"
Documentation = "https://github.com/mrx-org/bifti-phantoms/blob/main/python/bifti/README.md"
Repository = "https://github.com/mrx-org/bifti-phantoms"
Issues = "https://github.com/mrx-org/bifti-phantoms/issues"
Registry = "https://mrx-org.github.io/bifti-phantoms/"

[project.optional-dependencies]
# Resampling uses torch when it is importable and NumPy otherwise; see bifti._backend.
torch = ["torch>=2.13.0"]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    # test-only: the reference trilinear implementation the upsample path is checked
    # against. Resampling itself no longer needs scipy.
    "scipy>=1.18.0",
]
examples = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "mrzerocore>=1.0.4",
    "torch>=2.13.0",
]
